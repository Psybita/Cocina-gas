<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Cómo usar la cocina</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=DM+Sans:wght@300;400;500&display=swap');

  :root {
    --bg: #1a1612;
    --bg2: #231e18;
    --card: #2a231b;
    --accent: #d4883a;
    --text: #f0e8dc;
    --text2: #c8b89a;
    --text3: #8a7460;
    --border: rgba(212,136,58,0.2);
    --radius: 16px;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
  }

  .screen { display:none; min-height:100vh; }
  .screen.active { display:flex; flex-direction:column; }

  /* ─── SCREEN 1 ─── */
  #screen-lang {
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    background:
      radial-gradient(ellipse at 20% 20%, rgba(212,136,58,0.12) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 80%, rgba(212,136,58,0.08) 0%, transparent 60%),
      var(--bg);
  }

  .brand-icon {
    width: 86px; height: 86px;
    margin-bottom: 28px;
    filter: drop-shadow(0 4px 20px rgba(212,136,58,0.4));
  }

  .titles-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    margin-bottom: 6px;
  }

  .title-line {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .title-flag {
    font-size: 22px;
    flex-shrink: 0;
  }

  .title-text {
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    text-align: left;
    line-height: 1.2;
  }

  .title-text.large { font-size: clamp(20px, 5vw, 30px); color: var(--text); }
  .title-text.medium { font-size: clamp(20px, 5vw, 30px); color: var(--text); }
  .title-text.small { font-size: clamp(20px, 5vw, 30px); color: var(--text); }

  .divider {
    width: 60px; height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    margin: 28px auto;
  }

  /* Enter button */
  .enter-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: linear-gradient(135deg, var(--accent), #b86820);
    border: none;
    border-radius: var(--radius);
    padding: 20px 40px;
    cursor: pointer;
    transition: all 0.22s ease;
    box-shadow: 0 6px 24px rgba(212,136,58,0.35);
  }

  .enter-btn:hover, .enter-btn:active {
    transform: translateY(-2px);
    box-shadow: 0 10px 32px rgba(212,136,58,0.5);
  }

  .enter-btn-icon {
    font-size: 28px;
  }

  .enter-btn-arrow {
    font-size: 28px;
    color: #1a1612;
    font-weight: 700;
    line-height: 1;
  }

  /* ─── SCREEN 2: VIDEOS ─── */
  #screen-videos { background: var(--bg); }

  .video-header {
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 100;
    flex-shrink: 0;
  }

  .back-btn {
    width: 36px; height: 36px;
    border-radius: 10px;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--accent);
    font-size: 22px;
    cursor: pointer;
    display: flex; align-items:center; justify-content:center;
    flex-shrink:0;
    transition: all 0.2s;
    line-height:1;
  }
  .back-btn:hover { background: #342c22; border-color: var(--accent); }

  .header-title {
    font-family: 'Playfair Display', serif;
    font-size: 16px; font-weight: 700;
    color: var(--text);
  }

  .videos-wrap {
    padding: 24px 16px 44px;
    display: flex;
    flex-direction: column;
    gap: 32px;
    max-width: 560px;
    margin: 0 auto;
    width: 100%;
  }

  .video-label {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 14px;
  }

  .video-label-icon {
    width: 36px; height: 36px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), #b86820);
    display: flex; align-items:center; justify-content:center;
    font-size: 17px;
    flex-shrink:0;
    margin-top: 2px;
  }

  .video-label-lines {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .video-label-line {
    display: flex;
    align-items: center;
    gap: 7px;
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    line-height: 1.3;
  }

  .video-label-line.es { font-size: 16px; color: var(--text); }
  .video-label-line.en { font-size: 16px; color: var(--text); }
  .video-label-line.pt { font-size: 16px; color: var(--text); }

  .vflag { font-size: 16px; flex-shrink:0; }

  .video-frame-wrap {
    position: relative;
    width: 100%;
    border-radius: var(--radius);
    overflow: hidden;
    background: #000;
    border: 1px solid var(--border);
    box-shadow: 0 8px 32px rgba(0,0,0,0.55);
    height: min(calc(100vw * 16/9), 72vh);
  }

  .video-frame-wrap iframe {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    border: none;
  }

  .video-sep {
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--border), transparent);
  }
</style>
</head>
<body>

<!-- ════════ SCREEN 1 ════════ -->
<div id="screen-lang" class="screen active">

  <svg class="brand-icon" viewBox="0 0 90 90" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect x="5" y="18" width="80" height="54" rx="8" fill="#2a231b" stroke="#d4883a" stroke-width="1.5"/>
    <rect x="5" y="58" width="80" height="14" rx="4" fill="#342c22"/>
    <circle cx="26" cy="36" r="10" fill="none" stroke="#d4883a" stroke-width="1.8"/>
    <circle cx="26" cy="36" r="5"  fill="none" stroke="#d4883a" stroke-width="1.2"/>
    <circle cx="26" cy="36" r="1.5" fill="#d4883a"/>
    <circle cx="64" cy="36" r="10" fill="none" stroke="#d4883a" stroke-width="1.8"/>
    <circle cx="64" cy="36" r="5"  fill="none" stroke="#d4883a" stroke-width="1.2"/>
    <circle cx="64" cy="36" r="1.5" fill="#d4883a"/>
    <rect x="18" y="60" width="54" height="9" rx="3" fill="#231e18" stroke="#5a4a38" stroke-width="1"/>
    <rect x="30" y="62.5" width="30" height="4" rx="2" fill="#3a3028"/>
    <circle cx="22" cy="55" r="3.5" fill="#342c22" stroke="#d4883a" stroke-width="1"/>
    <circle cx="35" cy="55" r="3.5" fill="#342c22" stroke="#d4883a" stroke-width="1"/>
    <circle cx="55" cy="55" r="3.5" fill="#342c22" stroke="#d4883a" stroke-width="1"/>
    <circle cx="68" cy="55" r="3.5" fill="#342c22" stroke="#d4883a" stroke-width="1"/>
    <path d="M26 28 Q24 24 27 21 Q25 25 28 23 Q26 26 27 28 Z" fill="#e05a3a" opacity="0.8"/>
  </svg>

  <div class="titles-block">
    <div class="title-line">
      <span class="title-flag">🇦🇷</span>
      <span class="title-text large">Cómo usar la cocina</span>
    </div>
    <div class="title-line">
      <span class="title-flag">🇬🇧</span>
      <span class="title-text medium">How to use the stove</span>
    </div>
    <div class="title-line">
      <span class="title-flag">🇧🇷</span>
      <span class="title-text small">Como usar o fogão</span>
    </div>
  </div>

  <div class="divider"></div>

  <button class="enter-btn" onclick="openVideos()">
    <span class="enter-btn-icon">▶</span>
    <span class="enter-btn-arrow">›</span>
  </button>

</div>


<!-- ════════ SCREEN 2: VIDEOS ════════ -->
<div id="screen-videos" class="screen">

  <div class="video-header">
    <button class="back-btn" onclick="goBack()">‹</button>
    <div class="header-title">🇦🇷 Cómo usar la cocina &nbsp;·&nbsp; 🇬🇧 How to use the stove &nbsp;·&nbsp; 🇧🇷 Como usar o fogão</div>
  </div>

  <div class="videos-wrap">

    <!-- VIDEO 1 -->
    <div class="video-block">
      <div class="video-label">
        <div class="video-label-icon">🔥</div>
        <div class="video-label-lines">
          <div class="video-label-line es"><span class="vflag">🇦🇷</span> Encendido de hornallas</div>
          <div class="video-label-line en"><span class="vflag">🇬🇧</span> Lighting the burners</div>
          <div class="video-label-line pt"><span class="vflag">🇧🇷</span> Acendimento das bocas</div>
        </div>
      </div>
      <div class="video-frame-wrap">
        <iframe
          src="https://drive.google.com/file/d/1bv2XX2F0nbMhzGUA5kwJfdSzcRrtmJxc/preview"
          allow="autoplay"
          allowfullscreen>
        </iframe>
      </div>
    </div>

    <div class="video-sep"></div>

    <!-- VIDEO 2 -->
    <div class="video-block">
      <div class="video-label">
        <div class="video-label-icon">🍳</div>
        <div class="video-label-lines">
          <div class="video-label-line es"><span class="vflag">🇦🇷</span> Encendido de horno</div>
          <div class="video-label-line en"><span class="vflag">🇬🇧</span> Lighting the oven</div>
          <div class="video-label-line pt"><span class="vflag">🇧🇷</span> Acendimento do forno</div>
        </div>
      </div>
      <div class="video-frame-wrap">
        <iframe
          src="https://drive.google.com/file/d/1KcMnLBE2gaimDW_S33pc9XSdGJD-b8aZ/preview"
          allow="autoplay"
          allowfullscreen>
        </iframe>
      </div>
    </div>

  </div>
</div>

<script>
function openVideos() {
  document.getElementById('screen-lang').classList.remove('active');
  document.getElementById('screen-videos').classList.add('active');
  window.scrollTo(0, 0);
}

function goBack() {
  document.getElementById('screen-videos').classList.remove('active');
  document.getElementById('screen-lang').classList.add('active');
  window.scrollTo(0, 0);
}
</script>
</body>
</html>
